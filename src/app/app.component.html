<tui-root>
    @if (isUserLoggedIn) {
    <nav class="navbar">
        <div class="logo">DOM<span class="strike">IXO</span></div>

        <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox" #navToggle>
        <label for="nav-toggle" class="nav-toggle-label">
            <span></span>
        </label>

        <div class="nav-content">
            <div class="nav-items">
                <div class="nav-item" [class.active]="isActiveRoute('/dashboard')">
                    <a routerLink="/dashboard" (click)="navToggle.checked = false">🏠 Dashboard</a>
                </div>
                <div class="nav-item" [class.active]="isActiveRoute('/projects')">
                    <a routerLink="/projects" (click)="navToggle.checked = false">📁 Moje projekty</a>
                </div>
            </div>

            <div class="nav-profile">
                <div class="nav-item">
                    <a href="#" (click)="navToggle.checked = false">👤 Profil</a>
                </div>
                <div class="nav-item logout-btn" (click)="logout()">
                    🚪 Odhlásit
                </div>
            </div>
        </div>
    </nav>

    <div class="content">
        <router-outlet></router-outlet>
    </div>
    } @else {
    <div class="contentLoggedOut">
        <router-outlet></router-outlet>
    </div>
    }



</tui-root>
