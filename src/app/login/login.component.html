<div class="container">
    <div class="login-container">
        <h2>Login</h2>
        <form>
            <div>
                <label tuiLabel>
                    Username
                    <tui-textfield>
                        <input
                            placeholder="Enter your username"
                            tuiTextfield
                            type="text"
                            [(ngModel)]="username"
                            name="username"
                            required
                        />
                    </tui-textfield>
                </label>
            </div>
            <div>
                <label tuiLabel>
                Password
                <tui-textfield>
                    <input
                        placeholder="Enter your password"
                        tuiTextfield
                        type="password"
                        [(ngModel)]="password"
                        name="password"
                        required
                    />
                    <tui-icon tuiPassword />
                </tui-textfield>
                </label>
            </div>
            <button appearance="primary" tuiButton type="button">Login</button>
        </form>
    </div>
</div>
